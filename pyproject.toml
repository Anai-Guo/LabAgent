[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-agent"
version = "0.1.0"
description = "AI Harness for Lab - Connect AI to your lab instruments. From research question to publication-ready data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Anai Guo" },
]
keywords = [
    "laboratory-automation",
    "instrument-control",
    "SCPI",
    "GPIB",
    "pyvisa",
    "AI",
    "MCP",
    "electrochemistry",
    "spectroscopy",
    "photonics",
    "lock-in-amplifier",
    "oscilloscope",
    "potentiostat",
    "transport-measurement",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # Security floor: mcp < 1.28.1 accepts WebSocket handshakes without Host/Origin
    # validation in the deprecated mcp.server.websocket transport
    # (CVE-2026-59950 / GHSA-vj7q-gjh5-988w, fixed in 1.28.1). LabAgent only uses the
    # stdio transports (FastMCP server, mcp.client.stdio), so it is not directly
    # exposed, but the floor keeps `pip-audit` clean for downstream installs.
    "mcp>=1.28.1,<2",
    # Security floor: litellm < 1.104.0 (per-minor fixes 1.100.4 ... 1.103.1) is affected by
    # CVE-2026-114612 (proxy privilege escalation / RCE). LabAgent only uses the SDK, not the
    # proxy, but the floor keeps `pip-audit` clean for downstream installs. The floor also
    # clears the Python 3.11-only typing imports that broke Python 3.10 in 1.98.
    "litellm>=1.104.0,<2",
    "pyvisa>=1.14.0,<2",
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    # Security floor for litellm's transitive aiohttp dependency:
    # 3.13.x is affected by CVE-2026-34993 / CVE-2026-47265 (fixed in 3.14.0), and
    # 3.14.0 by CVE-2026-54273..54280 (fixed in 3.14.1), and 3.14.0-3.14.2 by
    # CVE-2026-59881 / CVE-2026-69243 / CVE-2026-69244 (fixed in 3.14.3), and 3.14.3 by
    # CVE-2026-111063..111066 / CVE-2026-111748..111750 / GHSA-2g87-pp6c-29x5 (fixed in 3.14.4).
    "aiohttp>=3.14.4",
]

[project.optional-dependencies]
tui = [
    "textual>=3.0.0,<4",
    "rich>=13.0.0,<14",
]
web = [
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
]
execution = [
    "pymeasure>=0.14.0,<1",
    "nidaqmx>=1.0.0",
    "pyqtgraph>=0.13.0",
    "MultiPyVu>=3.0.0,<4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
labharness = "lab_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_harness"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
